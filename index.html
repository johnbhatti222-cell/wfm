<html lang="en">
<head>

<title>Shift Roster</title>

<style>
:root{
  --bg:#f5f6f8; --panel:#ffffff; --panel2:#f9fafb; --ink:#171a1f; --muted:#5f6672; --line:#e2e5ea; --line2:#eef0f3;
  --accent:#2952d9; --accent-soft:#e8eeff; --accent-ink:#ffffff;
  --a-bg:#dbe6ff; --a-ink:#1d3f9e; --b-bg:#ebe2ff; --b-ink:#55289f;
  --wo-bg:#d7dade; --wo-ink:#454b55; --off-bg:#ffffff; --off-ink:#8a909a;
  --lv-bg:#1f9d55; --lv-ink:#ffffff; --hd-bg:#bdeccd; --hd-ink:#14532d;
  --wl:#e0a100; --wl-soft:#fdf1cf; --wl-ink:#6b4700;
  --ua-bg:#ffe4cf; --ua-ink:#8f3900;
  --bad:#d0302a; --bad-soft:#fde4e2; --warn:#b25e00; --warn-soft:#fff0dc; --good:#1f8a4c; --good-soft:#ddf4e6;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 4px 16px rgba(16,24,40,.06);
  --radius:10px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111317; --panel:#1a1d23; --panel2:#20242b; --ink:#e9ebef; --muted:#9aa1ad; --line:#2c313a; --line2:#242830;
    --accent:#7d9bff; --accent-soft:#232c4a; --accent-ink:#0d1020;
    --a-bg:#22335f; --a-ink:#c3d3ff; --b-bg:#352653; --b-ink:#dccbff;
    --wo-bg:#3a3e46; --wo-ink:#c5c9d0; --off-bg:#1a1d23; --off-ink:#6f7682;
    --lv-bg:#27a660; --lv-ink:#06140b; --hd-bg:#1f4a31; --hd-ink:#b8f0cc;
    --wl:#f0b429; --wl-soft:#3d3115; --wl-ink:#ffe0a0;
    --ua-bg:#4a2c16; --ua-ink:#ffc9a1;
    --bad:#ff6b63; --bad-soft:#42201f; --warn:#f3a64a; --warn-soft:#3d2a12; --good:#4cc67f; --good-soft:#173524;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111317; --panel:#1a1d23; --panel2:#20242b; --ink:#e9ebef; --muted:#9aa1ad; --line:#2c313a; --line2:#242830;
  --accent:#7d9bff; --accent-soft:#232c4a; --accent-ink:#0d1020;
  --a-bg:#22335f; --a-ink:#c3d3ff; --b-bg:#352653; --b-ink:#dccbff;
  --wo-bg:#3a3e46; --wo-ink:#c5c9d0; --off-bg:#1a1d23; --off-ink:#6f7682;
  --lv-bg:#27a660; --lv-ink:#06140b; --hd-bg:#1f4a31; --hd-ink:#b8f0cc;
  --wl:#f0b429; --wl-soft:#3d3115; --wl-ink:#ffe0a0;
  --ua-bg:#4a2c16; --ua-ink:#ffc9a1;
  --bad:#ff6b63; --bad-soft:#42201f; --warn:#f3a64a; --warn-soft:#3d2a12; --good:#4cc67f; --good-soft:#173524;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;line-height:1.25}
h2{font-size:17px;font-weight:650}
h3{font-size:14px;font-weight:650}
a{color:var(--accent)}
.muted{color:var(--muted)} .small{font-size:12px} .nowrap{white-space:nowrap} .num{font-variant-numeric:tabular-nums}
.hidden{display:none!important}

/* layout */
header.top{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:10px 16px}
header.top .brand{font-weight:700;font-size:15px;white-space:nowrap}
header.top .spacer{flex:1}
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:600;background:var(--panel2);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.badge.demo{background:var(--wl-soft);color:var(--wl-ink);border-color:transparent}
.badge.live{background:var(--good-soft);color:var(--good);border-color:transparent}
nav.tabs{display:flex;gap:2px;overflow-x:auto;padding:0 12px;background:var(--panel);border-bottom:1px solid var(--line);scrollbar-width:thin}
nav.tabs button{border:0;background:none;padding:11px 12px;cursor:pointer;color:var(--muted);font-weight:550;border-bottom:2px solid transparent;white-space:nowrap}
nav.tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}
nav.tabs button .count{margin-left:6px;background:var(--bad);color:#fff;border-radius:999px;padding:0 6px;font-size:11px}
main{padding:16px;max-width:1500px;margin:0 auto}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;min-width:0}
.card + .card{margin-top:16px}
.grid2 .card + .card{margin-top:0}
.card-h{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.card-h .spacer{flex:1}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar .spacer{flex:1}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--panel);padding:7px 12px;border-radius:8px;cursor:pointer;font-weight:550;white-space:nowrap}
.btn:hover{background:var(--panel2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--bad);border-color:var(--bad-soft)}
.btn.warn{background:var(--warn);border-color:var(--warn);color:#fff}
.btn.sm{padding:3px 8px;font-size:12px;border-radius:6px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--panel);padding:6px 11px;cursor:pointer;font-weight:550;color:var(--muted)}
.seg button + button{border-left:1px solid var(--line)}
.seg button.on{background:var(--accent-soft);color:var(--accent)}
input[type=text],input[type=password],input[type=date],input[type=number],select,textarea{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 9px;min-width:0}
input:focus,select:focus,textarea:focus,.btn:focus-visible,nav.tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:550}
label.f > input,label.f > select,label.f > textarea{color:var(--ink);font-size:14px;font-weight:400}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.form .full{grid-column:1/-1}
.chk{display:inline-flex;align-items:center;gap:6px}

/* tables */
.tbl-wrap{overflow:auto;border:1px solid var(--line);border-radius:8px}
table.t{border-collapse:collapse;width:100%;font-size:13px}
table.t th,table.t td{padding:7px 10px;border-bottom:1px solid var(--line2);text-align:left;vertical-align:middle}
table.t th{background:var(--panel2);font-weight:600;color:var(--muted);font-size:12px;position:sticky;top:0;z-index:1}
table.t tr:last-child td{border-bottom:0}
table.t tr.click{cursor:pointer}
table.t tr.click:hover td{background:var(--panel2)}

/* chips */
.chip{display:inline-flex;align-items:center;padding:1px 8px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.st-Approved{background:var(--lv-bg);color:var(--lv-ink)}
.st-Waitlisted{background:var(--wl-soft);color:var(--wl-ink)}
.st-Rejected,.st-Declined{background:var(--bad-soft);color:var(--bad)}
.st-Cancelled{background:var(--panel2);color:var(--muted)}
.st-Pending{background:var(--accent-soft);color:var(--accent)}
.sev-high{background:var(--bad-soft);color:var(--bad)}
.sev-medium{background:var(--warn-soft);color:var(--warn)}
.sev-low{background:var(--panel2);color:var(--muted)}

/* roster grid */
.grid-wrap{overflow:auto;border:1px solid var(--line);border-radius:8px;max-height:calc(100vh - 230px);background:var(--panel)}
table.roster{border-collapse:separate;border-spacing:0;font-size:12px;min-width:100%}
table.roster th,table.roster td{border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);padding:0;text-align:center}
table.roster thead th{position:sticky;top:0;z-index:3;background:var(--panel2);font-weight:600;color:var(--muted);padding:5px 2px;min-width:42px}
table.roster thead th.we{color:var(--ink)}
table.roster thead th.today{background:var(--accent-soft);color:var(--accent)}
table.roster .emp{position:sticky;left:0;z-index:2;background:var(--panel);text-align:left;padding:4px 10px;width:200px;min-width:180px;max-width:220px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-right:1px solid var(--line)}
table.roster thead .emp{z-index:4;background:var(--panel2)}
table.roster .emp .sub{display:block;color:var(--muted);font-size:11px}
table.roster tfoot td{position:sticky;bottom:0;background:var(--panel2);font-weight:600;padding:0 2px;height:26px;font-size:11px;z-index:2}
table.roster tfoot tr:first-child td{bottom:26px}
table.roster tfoot tr:first-child td{border-top:1px solid var(--line)}
table.roster tfoot .emp{z-index:4;background:var(--panel2)}
.cell{position:relative;display:flex;align-items:center;justify-content:center;height:34px;min-width:42px;font-weight:650;cursor:default;user-select:none}
.cell.edit{cursor:pointer}
.cell.edit:hover{filter:brightness(.95)}
.c-A{background:var(--a-bg);color:var(--a-ink)}
.c-B{background:var(--b-bg);color:var(--b-ink)}
.c-WO{background:var(--wo-bg);color:var(--wo-ink)}
.c-OFF{background:var(--off-bg);color:var(--off-ink);background-image:repeating-linear-gradient(135deg,transparent 0 5px,var(--line2) 5px 6px)}
.c-none{background:var(--off-bg);color:var(--off-ink);font-weight:400}
.c-load{background:linear-gradient(90deg,var(--line2),var(--panel2),var(--line2));background-size:200% 100%;animation:shimmer 1.2s linear infinite}
@keyframes shimmer{to{background-position:-200% 0}}
.c-L{background:var(--lv-bg);color:var(--lv-ink)}
.c-HD{background:linear-gradient(135deg,var(--hd-bg) 50%,var(--x-bg,var(--a-bg)) 50%);color:var(--hd-ink)}
.cell.conf{box-shadow:inset 0 0 0 2px var(--bad)}
.cell.conf-m{box-shadow:inset 0 0 0 2px var(--warn)}
.cell .wl{position:absolute;top:0;right:0;width:0;height:0;border-top:9px solid var(--wl);border-left:9px solid transparent}
.cell .ua{position:absolute;bottom:2px;left:2px;width:7px;height:7px;border-radius:50%;background:var(--ua-ink)}
.cell .sw{position:absolute;bottom:1px;right:3px;font-size:9px;opacity:.75}
.cell.flash{animation:flash 1.6s ease 2}
@keyframes flash{50%{box-shadow:inset 0 0 0 3px var(--accent)}}
.cov-ok{color:var(--good)} .cov-bad{color:var(--bad)} .cov-over{color:var(--warn)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px}
.legend span.k{display:inline-flex;align-items:center;justify-content:center;width:26px;height:18px;border-radius:4px;font-weight:700;font-size:11px;margin-right:5px;position:relative;vertical-align:middle}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;box-shadow:var(--shadow)}
.kpi .l{font-size:12px;color:var(--muted);font-weight:550}
.kpi .v{font-size:24px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--muted)}
.kpi.bad .v{color:var(--bad)} .kpi.good .v{color:var(--good)} .kpi.warn .v{color:var(--warn)}
.chart{width:100%;overflow-x:auto}
.chart svg{display:block}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal .dh{font-size:12px;color:var(--muted);font-weight:600;text-align:center}
.cal .day{border:1px solid var(--line);border-radius:8px;min-height:74px;padding:6px;display:flex;flex-direction:column;gap:4px;background:var(--panel)}
.cal .day.out{opacity:.4}
.cal .day.today{outline:2px solid var(--accent)}
.cal .day .n{font-size:12px;color:var(--muted);font-weight:600}
.cal .day .pill{border-radius:6px;padding:3px 6px;font-size:12px;font-weight:650;text-align:center;overflow:hidden}
.cal .short{display:none}
@media (max-width:640px){ .cal .short{display:inline} }

/* modal + toast */
.backdrop{position:fixed;inset:0;background:rgba(10,14,22,.45);display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px;z-index:50;overflow:auto}
.modal{background:var(--panel);border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.3);width:min(560px,100%);border:1px solid var(--line)}
.modal .mh{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.modal .mh h2{flex:1}
.modal .mb{padding:16px}
.modal .mf{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.x{border:0;background:none;font-size:20px;line-height:1;cursor:pointer;color:var(--muted);padding:4px}
.toasts{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:60;max-width:min(380px,calc(100vw - 32px))}
.toast{background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:8px;box-shadow:var(--shadow);font-size:13px}
.toast.err{background:var(--bad);color:#fff}
.issues{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.issue{display:flex;gap:8px;align-items:flex-start;padding:8px 10px;border-radius:8px;background:var(--panel2);font-size:13px}
.shiftbtns{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.shiftbtns button{border:2px solid transparent;border-radius:8px;padding:10px 4px;cursor:pointer;font-weight:700}
.shiftbtns button.on{border-color:var(--ink)}
.shiftbtns button small{display:block;font-weight:500;font-size:11px;opacity:.85}
.empty{padding:28px;text-align:center;color:var(--muted)}
.note{padding:10px 12px;border-radius:8px;background:var(--accent-soft);color:var(--ink);font-size:13px}
.note.warn{background:var(--warn-soft)}

/* login */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.login .card{width:min(400px,100%);padding:24px}
.login h1{font-size:20px;margin-bottom:4px}
.login form{display:flex;flex-direction:column;gap:12px;margin-top:16px}

@media (max-width:640px){
  main{padding:12px}
  header.top{padding:8px 12px;gap:8px}
  header.top .who,header.top .upd{display:none}
  header.top{flex-wrap:wrap}
  .cal{gap:3px}
  .cal .day{min-height:56px;padding:3px}
  .cal .day .pill{padding:2px 1px;font-size:11px}
  .cal .long{display:none}
  .grid2{grid-template-columns:1fr}
  .shiftbtns{grid-template-columns:repeat(2,1fr)}
  table.roster .emp{min-width:120px;max-width:140px}
}
</style>
</head>

<div id="app"></div>
<div class="toasts" id="toasts"></div>

<script>
/* ==========================================================================
   RosterCore — shared business logic.
   The SAME code runs in Google Apps Script (Code.gs) and in the browser
   (index.html). Edit src/core.js and run `python3 build.py` to update both.
   ========================================================================== */
var RosterCore = (function () {
  'use strict';

  var SCHEMA = {
    Config: ['Key', 'Value', 'Description'],
    Employees: ['EmpID', 'Name', 'Role', 'Department', 'Location', 'DefaultShift', 'Pattern', 'WeeklyOff', 'Access', 'Status', 'Email', 'PinHash'],
    Roster: ['Date', 'EmpID', 'Shift', 'Overlay', 'Source', 'Note', 'UpdatedBy', 'UpdatedAt'],
    Leaves: ['LeaveID', 'GroupID', 'EmpID', 'Name', 'Date', 'Shift', 'Category', 'Duration', 'Reason', 'Status', 'QueueNo', 'RequestedAt', 'DecidedBy', 'DecidedAt', 'Remarks'],
    Availability: ['ID', 'EmpID', 'Date', 'Type', 'Note', 'CreatedAt'],
    Demand: ['Date', 'Shift', 'Required'],
    Swaps: ['SwapID', 'Date', 'FromEmp', 'FromShift', 'ToEmp', 'ToShift', 'Reason', 'Status', 'RequestedAt', 'PeerRespondedAt', 'DecidedBy', 'DecidedAt'],
    Audit: ['At', 'By', 'Action', 'Detail']
  };

  var DEFAULT_CONFIG = [
    ['ORG_NAME', 'Call Centre', 'Shown in the dashboard header'],
    ['SHIFT_A_NAME', 'Morning', 'Name of shift A'],
    ['SHIFT_A_START', '06:00', 'Shift A start (24h HH:MM)'],
    ['SHIFT_A_END', '15:00', 'Shift A end (24h HH:MM)'],
    ['SHIFT_B_NAME', 'Evening', 'Name of shift B'],
    ['SHIFT_B_START', '14:00', 'Shift B start (24h HH:MM)'],
    ['SHIFT_B_END', '23:00', 'Shift B end; if earlier than start, the shift ends next day'],
    ['MAX_LEAVE_PER_SHIFT_PER_DAY', '1', 'First-come-first-serve cap: leave slots per shift per day'],
    ['LEAVE_CAP_SCOPE', 'SHIFT', 'What the cap applies to: SHIFT | SHIFT_DEPARTMENT | SHIFT_LOCATION | SHIFT_DEPARTMENT_LOCATION'],
    ['HALF_DAY_WEIGHT', '1', 'Slots used by a half day (1 = same as full day, 0.5 = two half days share a slot)'],
    ['LEAVE_CATEGORIES', 'Casual,Sick,Earned,Comp Off', 'Comma separated leave categories'],
    ['MIN_NOTICE_DAYS', '0', 'Days in advance employees must apply (supervisors exempt)'],
    ['MAX_DAYS_PER_REQUEST', '10', 'Longest leave in one request'],
    ['AUTO_PROMOTE_WAITLIST', 'TRUE', 'When an approved leave is cancelled, auto-approve the next person in the queue'],
    ['MIN_REST_HOURS', '11', 'Minimum rest between two shifts (conflict check)'],
    ['MAX_CONSECUTIVE_DAYS', '6', 'Maximum working days in a row (conflict check)'],
    ['ROTATION_WEEKS', '1', 'Rotational staff switch shift every N weeks'],
    ['ROTATION_ANCHOR', '2026-01-05', 'A Monday. Rotational staff work their default shift in the block starting here'],
    ['DEFAULT_PIN', '1234', 'PIN for new employees / blank PinHash; users must change it at first login'],
    ['SESSION_HOURS', '6', 'Login session length (max 6 on Google Apps Script)'],
    ['REFRESH_SECONDS', '30', 'Dashboard background refresh interval (seconds)'],
    ['CACHE_SECONDS', '120', 'Server read cache lifetime; manual Sheet edits clear it immediately (0 = off)']
  ];

  var SHIFT_CODES = ['A', 'B', 'WO', 'OFF'];
  var DURATIONS = { 'Full Day': 'L', 'First Half': 'HD1', 'Second Half': 'HD2' };
  var DOW = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

  /* ---------- date helpers (ISO yyyy-mm-dd strings, UTC maths) ---------- */
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function toISO(d) { return d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate()); }
  function parseISO(s) { var p = String(s).split('-'); return new Date(Date.UTC(+p[0], +p[1] - 1, +p[2])); }
  function isISO(s) { return /^\d{4}-\d{2}-\d{2}$/.test(String(s)); }
  function addDays(s, n) { var d = parseISO(s); d.setUTCDate(d.getUTCDate() + n); return toISO(d); }
  function addMonths(s, n) { var d = parseISO(s); d.setUTCMonth(d.getUTCMonth() + n); return toISO(d); }
  function diffDays(a, b) { return Math.round((parseISO(b) - parseISO(a)) / 86400000); }
  function dates(a, b) { var out = []; for (var d = a; d <= b; d = addDays(d, 1)) out.push(d); return out; }
  function dow(s) { return DOW[parseISO(s).getUTCDay()]; }
  function weekStart(s) { var w = parseISO(s).getUTCDay(); return addDays(s, -((w + 6) % 7)); }
  function mins(hhmm) { var p = String(hhmm).split(':'); return (+p[0] || 0) * 60 + (+p[1] || 0); }

  /* ---------- config ---------- */
  function getConfig(db) {
    var c = {};
    DEFAULT_CONFIG.forEach(function (r) { c[r[0]] = r[1]; });
    (db.Config || []).forEach(function (r) {
      if (r.Key && String(r.Value).trim() !== '') c[String(r.Key).trim()] = String(r.Value).trim();
    });
    return c;
  }
  function num(c, k) {
    var v = parseFloat(c[k]);
    if (isNaN(v)) { DEFAULT_CONFIG.forEach(function (r) { if (r[0] === k) v = parseFloat(r[1]); }); }
    return v;
  }
  function bool(c, k) { return /^(true|yes|y|1)$/i.test(String(c[k])); }
  function shiftDefs(c) {

      db.Employees.push({ EmpID: p[0], Name: p[1], Role: p[2], Department: p[3], Location: p[4], DefaultShift: p[5], Pattern: p[6],
        WeeklyOff: p[7], Access: p[8], Status: 'Active', Email: '', PinHash: hashPin(p[0], '1234') });
    });
    var start = weekStart(today), end = addDays(start, 41);
    dates(addDays(start, -7), end).forEach(function (d) {
      var wk = dow(d) === 'Sat' || dow(d) === 'Sun';
      var bump = (parseISO(d).getUTCDate() % 5 === 0) ? 1 : 0;
      db.Demand.push({ Date: d, Shift: 'A', Required: (wk ? 5 : 7) + bump });
      db.Demand.push({ Date: d, Shift: 'B', Required: wk ? 4 : 6 });
    });
    var nowIso = ctx.now().toISOString();
    generate(db, { start: addDays(start, -7), end: addDays(start, 27), keepManual: false }, 'seed', nowIso);
    db.Availability.push({ ID: 'AV1', EmpID: 'E013', Date: addDays(today, 3), Type: 'Training', Note: 'Product training', CreatedAt: nowIso });
    // show first-come-first-serve: two people ask for the same shift/day a few seconds apart
    var t = ctx.now().getTime() - 3600 * 1000, n = 0;
    function apply(id, from, to, dur, cat) {
      var e = db.Employees.filter(function (x) { return x.EmpID === id; })[0];
      var d = from;
      while (!isWork(currentShift(db, getConfig(db), e, d))) d = addDays(d, 1);
      var sess = 'seed-' + id;
      ctx.cache.put('s:' + sess, id, 60);
      var fakeCtx = { now: function () { return new Date(t + (n++) * 7000); }, today: function () { return today; }, uuid: ctx.uuid, cache: ctx.cache };
      handle(db, { action: 'requestLeave', token: sess, from: d, to: to && to > d ? to : d, duration: dur, category: cat, reason: 'Sample request' }, fakeCtx);
      return d;
    }
    var d1 = apply('E005', addDays(today, 2), null, 'Full Day', 'Casual');
    var e5 = db.Employees.filter(function (x) { return x.EmpID === 'E005'; })[0];
    var s1 = currentShift(db, getConfig(db), e5, d1);
    var rival = db.Employees.filter(function (x) { return x.EmpID !== 'E005' && x.Access === 'Employee' && currentShift(db, getConfig(db), x, d1) === s1; })[0];
    if (rival) apply(rival.EmpID, d1, null, 'Full Day', 'Earned');
    apply('E009', addDays(today, 6), addDays(today, 7), 'Full Day', 'Earned');
    apply('E012', addDays(today, 4), null, 'First Half', 'Sick');
    return db;
  }

  return {
    SCHEMA: SCHEMA, DEFAULT_CONFIG: DEFAULT_CONFIG, DURATIONS: DURATIONS, SHIFT_CODES: SHIFT_CODES,
    handle: handle, isWrite: isWrite, unpack: unpack, snapshot: snapshot, seed: seed, hashPin: hashPin, sha256: sha256,
    getConfig: getConfig, shiftDefs: shiftDefs, plannedShift: plannedShift, currentShift: currentShift,
    detectConflicts: detectConflicts, checkAssignment: checkAssignment, staffing: staffing, suggestMoves: suggestMoves,
    generate: generate, periodEnd: periodEnd, leavePreview: leavePreview, matchFilters: matchFilters,
    util: { addDays: addDays, addMonths: addMonths, diffDays: diffDays, dates: dates, dow: dow, weekStart: weekStart, isISO: isISO,
      parseISO: parseISO, toISO: toISO, byKey: byKey, isWork: isWork, isWeeklyOff: isWeeklyOff, isSup: isSup, isAdmin: isAdmin, num: num }
  };
})();
/* node */ if (typeof module !== 'undefined') module.exports = RosterCore;

</script>

<script>
'use strict';
const U = RosterCore.util;
const LEGEND_TXT = {A:'', B:'', WO:'Weekly off', OFF:'Off / not scheduled'};
const S = {
  token: null, me: null, d: null, tab: null, span: 7, rosterStart: null, calMonth: null,
  filters: {Role:'', Department:'', Location:'', Pattern:'', DefaultShift:'', q:''},
  build: null, timer: null, loading: false, flash: null, leaveFilter: 'Active'
};

/* ---------------- utilities ---------------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function localToday(){ const d = new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
const today = () => (S.d && S.d.today) || localToday();
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fmtD(iso, withDow = true){ const d = U.parseISO(iso); return (withDow ? U.dow(iso)+' ' : '') + d.getUTCDate()+' '+MON[d.getUTCMonth()]; }
function fmtTs(ts){ if(!ts) return ''; const d = new Date(ts); if(isNaN(d)) return esc(ts);
  const p = (n, l = 2) => String(n).padStart(l, '0');
  return d.getDate() + ' ' + MON[d.getMonth()] + ' ' + p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds()) + '.' + p(d.getMilliseconds(), 3); }
function toast(msg, err){ const t = document.createElement('div'); t.className = 'toast' + (err ? ' err' : ''); t.textContent = msg; $('#toasts').appendChild(t); setTimeout(() => t.remove(), err ? 6000 : 3500); }
function store(k, v){ try { if (v === undefined) return sessionStorage.getItem(k); if (v === null) sessionStorage.removeItem(k); else sessionStorage.setItem(k, v); } catch(e){ return null; } }
const isSup = () => U.isSup(S.me), isAdmin = () => U.isAdmin(S.me);
const cfg = () => S.d.config;
const SD = () => RosterCore.shiftDefs(cfg());
const empById = id => S.d.employees.find(e => e.EmpID === id);
function localDb(){ return { Config: Object.keys(cfg()).map(k => ({Key:k, Value:cfg()[k]})), Employees: S.d.employees, Roster: S.d.roster,
  Leaves: S.d.leaves, Availability: S.d.availability, Demand: S.d.demand, Swaps: S.d.swaps }; }
function distinct(field){ return Array.from(new Set(S.d.employees.map(e => e[field]).filter(Boolean))).sort(); }

/* ---------------- transport: live (Apps Script) or demo (in-browser) ---------------- */
const Demo = {
  mem: null, cacheMem: {},
  load(){ let s = null; try { s = localStorage.getItem('roster-demo-db'); } catch(e){}
    if (!s) s = this.mem;
    if (!s) { const db = RosterCore.seed(localToday(), this.ctx); this.save(db); return JSON.parse(this.mem); }
    return JSON.parse(s); },
  save(db){ this.mem = JSON.stringify(db); try { localStorage.setItem('roster-demo-db', this.mem); } catch(e){} },
  reset(){ try { localStorage.removeItem('roster-demo-db'); } catch(e){} this.mem = null; },
  cache(){ try { return JSON.parse(localStorage.getItem('roster-demo-cache') || '{}'); } catch(e){ return this.cacheMem; } },
  saveCache(c){ this.cacheMem = c; try { localStorage.setItem('roster-demo-cache', JSON.stringify(c)); } catch(e){} },
  ctx: {
    now: () => new Date(), today: localToday,
    uuid: () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(16) + Math.random().toString(16).slice(2)),
    cache: {
      get(k){ const c = Demo.cache(), v = c[k]; if (!v || v.x < Date.now()) return null; return v.v; },
      put(k, v, sec){ const c = Demo.cache(); c[k] = {v, x: Date.now() + (sec || 600) * 1000}; Demo.saveCache(c); },
      remove(k){ const c = Demo.cache(); delete c[k]; Demo.saveCache(c); }
    }
  },
  call(req){
    try {
      const db = this.load(), res = RosterCore.handle(db, req, this.ctx);
      if (res.out.ok && res.dirty.length) { db.Audit = (db.Audit || []).concat(res.audit).slice(-500); this.save(db); }
      return JSON.parse(JSON.stringify(res.out));
    } catch (e) { return {ok:false, error: e.message || String(e)}; }
  }
};
async function api(action, params = {}){
  const req = Object.assign({action, token: S.token}, params);
  let res;
  if (!API_URL) { await Promise.resolve(); res = Demo.call(req); }
  else {
    try {
      const r = await fetch(API_URL, {method:'POST', body: JSON.stringify(req), headers:{'Content-Type':'text/plain;charset=utf-8'}, redirect:'follow'});
      res = await r.json();
    } catch (e) { res = {ok:false, error:'Cannot reach the server. Check your connection or the API_URL.'}; }
  }
  if (!res.ok && res.error === 'SESSION_EXPIRED' && action !== 'login') { toast('Session expired — please log in again', true); logout(true); }
  return res;
}

/* ---------------- login ---------------- */
function renderLogin(){
  stopTimer();
  $('#app').innerHTML = `
  <div class="login"><div class="card">
    <h1>Shift Roster</h1>
    <div class="muted">Sign in with your Employee ID and PIN</div>
    ${!API_URL ? `<div class="note warn small" style="margin-top:12px"><b>Demo mode</b> — sample data stays in this browser.<br>
      Try <b>E001</b> (Admin), <b>E002</b> (Supervisor) or <b>E005</b> (Agent), PIN <b>1234</b>.</div>` : ''}
    <form id="lf">
      <label class="f">Employee ID<input id="lid" type="text" autocomplete="username" required autofocus></label>
      <label class="f">PIN<input id="lpin" type="password" inputmode="numeric" autocomplete="current-password" required></label>
      <button class="btn primary" id="lbtn">Sign in</button>
      <div id="lerr" class="small" style="color:var(--bad)"></div>
    </form>
    ${!API_URL ? `<button class="btn sm" style="margin-top:14px" id="resetDemo">Reset demo data</button>` : ''}
  </div></div>`;
  $('#lf').onsubmit = async ev => {
    ev.preventDefault(); $('#lbtn').disabled = true; $('#lerr').textContent = '';
    $('#lbtn').textContent = 'Signing in…';
    const res = await api('login', {empId: $('#lid').value, pin: $('#lpin').value, snap: defaultWin()});
    $('#lbtn').disabled = false; $('#lbtn').textContent = 'Sign in';
    if (!res.ok) { $('#lerr').textContent = res.error; return; }
    S.token = res.data.token; store('roster-token', S.token);
    S.me = res.data.me;
    await boot(res.snapshot);
    if (res.data.mustChangePin) changePin(true);
  };
  const rd = $('#resetDemo'); if (rd) rd.onclick = () => { Demo.reset(); toast('Demo data reset'); };
}
async function logout(silent){
  if (!silent && S.token) api('logout');
  S.token = null; S.me = null; S.d = null; S.tab = null; store('roster-token', null); store('roster-snap', null); renderLogin();
}

/* ---------------- data loading ---------------- */
function rosterEnd(){ return S.span === 'month' ? U.addDays(U.addMonths(S.rosterStart, 1), -1) : U.addDays(S.rosterStart, S.span - 1); }
function rangeForTab(){
  const t = today();
  switch (S.tab) {
    case 'dash': return [U.addDays(t, -7), U.addDays(t, 21)];
    case 'roster': case 'conflicts': case 'demand': return [U.addDays(S.rosterStart, -7), U.addDays(rosterEnd(), S.span === 'month' ? 31 : S.span + 1)]; // includes next period = prefetch
    case 'mine': { const m = S.calMonth; return [U.addDays(U.weekStart(m), -7), U.addDays(U.addMonths(m, 1), 7)]; }
    case 'build': { const b = S.build || {}; const s = b.start || U.weekStart(U.addDays(t, 7)); return [U.addDays(s, -7), U.addDays(RosterCore.periodEnd(s, b.period || 'week'), 1)]; }
    default: return [U.addDays(t, -7), U.addDays(t, 60)];
  }
}
/* ===== Instant data layer =====
   All data for a wide date window lives in the browser. Clicking a tab or a date renders
   immediately from memory (no network). The server is only contacted in the background:
   - when you navigate outside the loaded window (it is extended and prefetched),
   - for the periodic refresh,
   - to save changes. Saves are applied on screen instantly ("optimistic") using the same
     rules engine as the server, then confirmed; if the server rejects one, it is undone. */
const defaultWin = () => { const t = localToday(); return [U.addDays(t, -14), U.addDays(t, 56)]; };
const MEMO = {};
function memo(key, fn){ const k = S.ver + '|' + key; if (!(k in MEMO)) { const ks = Object.keys(MEMO); if (ks.length > 60) ks.forEach(x => delete MEMO[x]); MEMO[k] = fn(); } return MEMO[k]; }
S.ver = 0; S.pending = 0; S.queue = Promise.resolve(); S.fetching = null; S.snapStr = '';
function setData(snap, persist = true){
  const d = Object.assign({}, snap);
  ['roster', 'leaves', 'availability', 'demand'].forEach(k => d[k] = RosterCore.unpack(snap[k]));
  S.d = d; S.me = d.me; S.ver++; S.loadedAt = new Date();
  if (persist) { try { S.snapStr = JSON.stringify(snap); store('roster-snap', S.snapStr); } catch (e) {} }
}
function applyLocal(db){
  Object.assign(S.d, {roster: db.Roster, leaves: db.Leaves, availability: db.Availability, demand: db.Demand, swaps: db.Swaps, employees: db.Employees});
  const c = RosterCore.getConfig(db); S.d.config = c;
  if (S.d.configRows) S.d.configRows.forEach(r => r.Value = c[r.Key]);
  S.ver++;
}
function busyTyping(){ const a = document.activeElement; return a && /INPUT|SELECT|TEXTAREA/.test(a.tagName) && a.closest('#view'); }
function softRender(){ if (busyTyping()) { S.needRender = true; return; } S.needRender = false; render(); }
document.addEventListener('focusout', () => setTimeout(() => { if (S.needRender && !busyTyping()) softRender(); }, 0));
function load(){ render(); ensure(); }          // instant: render from memory, fetch only if the window is missing
function ensure(){
  if (!S.d) return;
  const [a, b] = rangeForTab(), [lo, hi] = S.d.range;
  if (a >= lo && b <= hi) return;
  let nlo = a < lo ? a : lo, nhi = b > hi ? b : hi;
  if (U.diffDays(nlo, nhi) > 190) { nlo = U.addDays(a, -14); nhi = U.addDays(b, 42); }
  fetchWindow(nlo, nhi);
}
async function fetchWindow(lo, hi){
  if (S.fetching && S.fetching[0] === lo && S.fetching[1] === hi) return;
  S.fetching = [lo, hi]; setSync();
  const r = await api('bootstrap', {start: lo, end: hi});
  if (!S.fetching || S.fetching[0] !== lo || S.fetching[1] !== hi) return;
  S.fetching = null;
  if (r.ok && S.pending === 0) { setData(r.data); softRender(); } else if (!r.ok && r.error !== 'SESSION_EXPIRED') toast(r.error, true);
  setSync();
}
async function refresh(force){
  if (!S.d || S.pending || S.fetching) return;
  const r = await api('bootstrap', {start: S.d.range[0], end: S.d.range[1]});
  if (!r.ok || S.pending) return;
  const str = JSON.stringify(r.data);
  if (!force && str.replace(/"serverTime":"[^"]*"/, '') === S.snapStr.replace(/"serverTime":"[^"]*"/, '')) { S.loadedAt = new Date(); setSync(); return; }
  setData(r.data); softRender();
}
const OPTIMISTIC = new Set(['setShift', 'generate', 'applyMoves', 'cancelLeave', 'forceApprove', 'addAvailability', 'removeAvailability',
  'requestSwap', 'respondSwap', 'decideSwap', 'cancelSwap', 'saveDemand', 'upsertEmployee', 'saveConfig']);
const LocalCtx = { now: () => new Date(), today: () => today(), uuid: () => Demo.ctx.uuid(),
  cache: { get: k => (k === 's:local' && S.me ? S.me.EmpID : null), put(){}, remove(){} } };
function enqueue(action, params){
  S.pending++; setSync();
  const p = S.queue.then(() => api(action, Object.assign({snap: S.d.range}, params))).then(r => {
    S.pending--;
    if (r.ok && r.snapshot && S.pending === 0) { setData(r.snapshot); softRender(); }
    setSync(); return r;
  });
  S.queue = p.catch(() => {});
  return p;
}
/* Write: optimistic actions return instantly; leave requests (FCFS) wait for the server's timestamp. */
async function write(action, params = {}){
  if (!OPTIMISTIC.has(action)) return enqueue(action, params);
  const db = JSON.parse(JSON.stringify(localDb()));
  let res;
  try { res = RosterCore.handle(db, Object.assign({action, token: 'local'}, params), LocalCtx); }
  catch (e) { return {ok: false, error: e.message || String(e)}; }
  if (!res.out.ok) return res.out;                       // instant validation / conflict check, nothing sent
  applyLocal(db); softRender();
  enqueue(action, params).then(r => { if (!r.ok && r.error !== 'SESSION_EXPIRED') { toast('Not saved: ' + r.error + ' — change undone', true); refresh(true); } });
  return res.out;
}
function setSync(){
  const el = $('#sync'); if (!el) return;
  if (S.pending) { el.innerHTML = '<span style="color:var(--warn)">●</span> Saving…'; return; }
  if (S.fetching) { el.innerHTML = '<span style="color:var(--accent)">●</span> Loading dates…'; return; }
  el.innerHTML = '<span style="color:var(--good)">✓</span> Synced ' + S.loadedAt.toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'});
}
function initState(){
  const t = localToday();
  S.rosterStart = S.rosterStart || U.weekStart(t);
  S.calMonth = S.calMonth || t.slice(0, 8) + '01';
  S.tab = S.tab || (U.isSup(S.me) ? 'dash' : 'mine');
}
async function boot(snap){
  if (snap) setData(snap);
  else {
    const w = defaultWin(), r = await api('bootstrap', {start: w[0], end: w[1]});
    if (!r.ok) { if (r.error !== 'SESSION_EXPIRED') toast(r.error, true); return false; }
    setData(r.data);
  }
  initState(); render(); ensure(); startTimer();
  return true;
}
function startTimer(){
  stopTimer();
  const sec = Math.max(15, +(S.d && S.d.config.REFRESH_SECONDS) || 30);
  S.timer = setInterval(() => { if (!document.hidden) refresh(); }, sec * 1000);
}
function stopTimer(){ if (S.timer) clearInterval(S.timer); S.timer = null; }
document.addEventListener('visibilitychange', () => { if (!document.hidden && S.d) refresh(); });

/* ---------------- shell ---------------- */
const TABS = [
  {id:'dash', label:'Dashboard', sup:true},
  {id:'roster', label:'Roster'},
  {id:'build', label:'Build schedule', sup:true},
  {id:'conflicts', label:'Conflicts', sup:true},
  {id:'leaves', label:'Leave & approvals', sup:true},
  {id:'demand', label:'Demand', sup:true},
  {id:'mine', label:'My schedule'},
  {id:'self', label:'Self-service'},
  {id:'people', label:'Employees', admin:true},
  {id:'settings', label:'Settings', admin:true}
];
function render(){
  if (!S.d) return;
  const c = cfg();
  const tabs = TABS.filter(t => (!t.sup || isSup()) && (!t.admin || isAdmin()));
  if (!tabs.find(t => t.id === S.tab)) S.tab = tabs[0].id;
  const pendingSup = isSup() ? S.d.swaps.filter(w => w.Status === 'Pending Supervisor').length : 0;
  const pendingMe = S.d.swaps.filter(w => w.ToEmp === S.me.EmpID && w.Status === 'Pending Peer').length;
  const sc = window.scrollY, gw = $('.grid-wrap'), gs = gw ? [gw.scrollLeft, gw.scrollTop] : null;
  $('#app').innerHTML = `
  <header class="top">
    <div class="brand">${esc(c.ORG_NAME)} · Roster</div>
    <span class="badge ${API_URL ? 'live' : 'demo'}">${API_URL ? 'Live · Google Sheets' : 'Demo data'}</span>
    <span class="spacer"></span>
    <span class="upd small muted nowrap" id="sync" title="Background sync every ${esc(c.REFRESH_SECONDS)}s"></span>
    <button class="btn sm" id="refresh" title="Refresh from server">↻</button>
    <span class="who small nowrap"><b>${esc(S.me.Name)}</b> <span class="muted">· ${esc(S.me.Access)}</span></span>
    <button class="btn sm" id="pinBtn">Change PIN</button>
    <button class="btn sm" id="outBtn">Sign out</button>
  </header>
  <nav class="tabs">${tabs.map(t => `<button data-tab="${t.id}" class="${t.id === S.tab ? 'on' : ''}">${t.label}${
      t.id === 'leaves' && pendingSup ? `<span class="count">${pendingSup}</span>` : ''}${t.id === 'self' && pendingMe ? `<span class="count">${pendingMe}</span>` : ''}</button>`).join('')}</nav>
  <main id="view"></main>`;
  $$('nav.tabs button').forEach(b => { const go = () => { if (S.tab !== b.dataset.tab) { S.tab = b.dataset.tab; load(); } }; b.onpointerdown = go; b.onclick = go; });
  $('#refresh').onclick = () => refresh(true);
  $('#outBtn').onclick = () => logout();
  $('#pinBtn').onclick = () => changePin(false);
  const V = $('#view');
  ({dash: viewDash, roster: viewRoster, build: viewBuild, conflicts: viewConflicts, leaves: viewLeaves, demand: viewDemand,
    mine: viewMine, self: viewSelf, people: viewPeople, settings: viewSettings})[S.tab](V);
  window.scrollTo(0, sc);
  const gw2 = $('.grid-wrap'); if (gw2 && gs) { gw2.scrollLeft = gs[0]; gw2.scrollTop = gs[1]; }
  setSync();
}

/* ---------------- modal ---------------- */
function modal(title, body, buttons){
  closeModal();
  const b = document.createElement('div'); b.className = 'backdrop';
  b.innerHTML = `<div class="modal" role="dialog" aria-modal="true"><div class="mh"><h2>${esc(title)}</h2><button class="x" aria-label="Close">×</button></div>
    <div class="mb">${body}</div><div class="mf"></div></div>`;
  b.querySelector('.x').onclick = closeModal;
  b.addEventListener('mousedown', e => { if (e.target === b) closeModal(); });
  const f = b.querySelector('.mf');
  (buttons || [{label:'Close'}]).forEach(btn => {
    const el = document.createElement('button'); el.className = 'btn ' + (btn.cls || ''); el.textContent = btn.label;
    if (btn.id) el.id = btn.id;
    el.onclick = async () => { if (btn.onClick) { el.disabled = true; const keep = await btn.onClick(el); el.disabled = false; if (keep === true) return; } b.remove(); };
    f.appendChild(el);
  });
  document.body.appendChild(b);
  const first = b.querySelector('input,select,textarea'); if (first) first.focus();
  return b;
}
function closeModal(){ $$('.backdrop').forEach(x => x.remove()); }
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

function changePin(forced){
  modal(forced ? 'Set your own PIN' : 'Change PIN', `
    ${forced ? '<div class="note warn small" style="margin-bottom:12px">You are using the default PIN. Please choose a personal PIN (4–8 digits).</div>' : ''}
    <div class="form"><label class="f">Current PIN<input id="op" type="password" inputmode="numeric"></label>
    <label class="f">New PIN<input id="np" type="password" inputmode="numeric"></label>
    <label class="f">Repeat new PIN<input id="np2" type="password" inputmode="numeric"></label></div>`,
  [{label:'Cancel'}, {label:'Save PIN', cls:'primary', onClick: async () => {
    if ($('#np').value !== $('#np2').value) { toast('New PINs do not match', true); return true; }
    const r = await write('changePin', {oldPin: $('#op').value, newPin: $('#np').value});
    if (!r.ok) { toast(r.error, true); return true; }
    toast('PIN changed');
  }}]);
}

/* ---------------- shared roster cell rendering ---------------- */
function cellInfo(db, idx, leavesIdx, availIdx, empId, d){
  const r = (idx[d + '|' + empId] || [])[0];
  let code = r ? r.Shift : '', cls = r ? 'c-' + r.Shift : 'c-none', label = r ? (r.Shift === 'OFF' ? '–' : r.Shift) : '·', style = '';
  if (r && r.Overlay === 'L') { cls = 'c-L'; label = 'L'; }
  else if (r && r.Overlay) { cls = 'c-HD'; label = '½' + r.Shift; style = `--x-bg:var(--${r.Shift === 'B' ? 'b' : 'a'}-bg)`; }
  const wl = (leavesIdx[d + '|' + empId] || []).some(l => l.Status === 'Waitlisted');

function indexes(db){

function rosterGrid(db, days, emps, opts = {}){

  const st = opts.memo ? memo('st' + days[0] + days[days.length - 1], () => RosterCore.staffing(db, days[0], days[days.length - 1])) : RosterCore.staffing(db, days[0], days[days.length - 1]);
  const sd = RosterCore.shiftDefs(RosterCore.getConfig(db)), t = today(), win = opts.win;

    days.map(d => {

      const hi = cf.some(x => x.Severity === 'high'), tip = [
        ci.r ? (U.isWork(ci.r.Shift) ? sd[ci.r.Shift].name + ' ' + sd[ci.r.Shift].start + '–' + sd[ci.r.Shift].end : (ci.r.Shift === 'WO' ? 'Weekly off' : 'Off')) : 'Not scheduled',
        ci.r && ci.r.Overlay === 'L' ? 'On leave (full day)' : ci.r && ci.r.Overlay ? 'Half-day leave (' + (ci.r.Overlay === 'HD1' ? 'first' : 'second') + ' half)' : '',
        ci.wl ? 'Leave request waitlisted' : '', ci.ua ? ci.ua.Type + (ci.ua.Note ? ': ' + ci.ua.Note : '') : '',
        ci.r && ci.r.Source === 'Swap' ? 'Swapped' : '', ci.r && ci.r.Note ? 'Note: ' + ci.r.Note : ''
      ].concat(cf.map(x => '⚠ ' + x.Message)).filter(Boolean).join('\n');
      return `<td><div class="cell ${ci.cls} ${opts.editable ? 'edit' : ''} ${cf.length ? (hi ? 'conf' : 'conf-m') : ''}" style="${ci.style}" data-d="${d}" data-e="${esc(e.EmpID)}" title="${esc(tip)}" ${opts.editable ? 'tabindex="0" role="button"' : ''}>${esc(ci.label)}${ci.wl ? '<span class="wl"></span>' : ''}${ci.ua ? '<span class="ua"></span>' : ''}${ci.r && ci.r.Source === 'Swap' ? '<span class="sw">⇄</span>' : ''}</div></td>`;
    }).join('')}</tr>`).join('');
  const covRow = s => `<tr><td class="emp">${esc(sd[s].name)} (${s}) <span class="muted">scheduled / required</span></td>${days.map(d => {
      const x = st[d][s], cls = x.sched < x.req ? 'cov-bad' : x.sched > x.req + 1 ? 'cov-over' : 'cov-ok';
      return `<td class="${cls} num" title="${x.sched} scheduled, ${x.req} required, ${x.leave} on leave">${fmtN(x.sched)}/${x.req}</td>`; }).join('')}</tr>`;
  return `<div class="grid-wrap"><table class="roster"><thead><tr><th class="emp">Employee (${emps.length})</th>${head}</tr></thead>
    <tbody>${body || `<tr><td class="emp muted">No employees match</td></tr>`}</tbody>

}
const fmtN = n => (Math.round(n * 2) / 2).toString().replace('.5', '½');

function editCell(empId, date){

  const opts = [['A', sd.A.name, sd.A.start + '–' + sd.A.end], ['B', sd.B.name, sd.B.start + '–' + sd.B.end], ['WO', 'Weekly off', ''], ['OFF', 'Off', 'not scheduled']];

function drawChart(host, days, st){
  const sd = SD(), W = Math.max(640, days.length * 58), H = 210, pad = {l:30, r:10, t:14, b:34};
  const max = Math.max(1, ...days.flatMap(d => ['A', 'B'].map(s => Math.max(st[d][s].req, st[d][s].sched)))) * 1.15;
  const y = v => pad.t + (H - pad.t - pad.b) * (1 - v / max), gw = (W - pad.l - pad.r) / days.length, bw = Math.min(18, gw / 2 - 5);
  let g = '';
  for (let i = 0; i <= 4; i++) { const v = Math.round(max * i / 4); g += `<line x1="${pad.l}" x2="${W - pad.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line2)"/><text x="${pad.l - 6}" y="${y(v) + 4}" text-anchor="end" font-size="10" fill="var(--muted)">${v}</text>`; }
  days.forEach((d, i) => {
    const x0 = pad.l + gw * i + gw / 2;
    ['A', 'B'].forEach((s, j) => {
      const x = st[d][s], bx = x0 + (j ? 1 : -1) * (bw / 2 + 2) - bw / 2, short = x.sched < x.req;
      g += `<rect x="${bx}" y="${y(x.sched)}" width="${bw}" height="${Math.max(0, y(0) - y(x.sched))}" rx="3" fill="var(--${s === 'A' ? 'a' : 'b'}-ink)" opacity="${short ? .45 : .85}"><title>${fmtD(d)} ${sd[s].name}: ${x.sched} scheduled / ${x.req} required</title></rect>`;
      g += `<line x1="${bx - 3}" x2="${bx + bw + 3}" y1="${y(x.req)}" y2="${y(x.req)}" stroke="${short ? 'var(--bad)' : 'var(--ink)'}" stroke-width="2.5" stroke-linecap="round"/>`;
    });
    g += `<text x="${x0}" y="${H - 18}" text-anchor="middle" font-size="10" fill="var(--muted)">${U.dow(d)}</text><text x="${x0}" y="${H - 6}" text-anchor="middle" font-size="10" fill="var(--muted)">${U.parseISO(d).getUTCDate()}</text>`;
  });
  host.innerHTML = `<svg width="${W}" height="${H}" role="img" aria-label="Scheduled versus required headcount by day and shift">${g}</svg>
    <div class="legend"><span><span class="k" style="background:var(--a-ink)"></span>${esc(sd.A.name)} scheduled</span><span><span class="k" style="background:var(--b-ink)"></span>${esc(sd.B.name)} scheduled</span>
    <span><span class="k" style="height:3px;background:var(--ink)"></span>Required</span><span><span class="k" style="height:3px;background:var(--bad)"></span>Required (short)</span></div>`;
}
function gotoCell(empId, date){

/* ---------------- VIEW: conflicts ---------------- */
function viewConflicts(V){
  const start = S.rosterStart, end = rosterEnd(), db = localDb();
  const all = memo('conf' + start + end, () => RosterCore.detectConflicts(db, start, end));
  const st = memo('st' + start + end, () => RosterCore.staffing(db, start, end)), sd = SD();
  const types = {};
  all.forEach(x => types[x.Type] = (types[x.Type] || 0) + 1);
  const DESC = {DOUBLE_BOOKING: 'Same person rostered more than once on a day', LEAVE_CLASH: 'Roster and approved leave disagree', UNAVAILABLE: 'Rostered while marked unavailable',
    REST: 'Too little rest between shifts', CONSECUTIVE: 'Too many working days in a row', INACTIVE: 'Inactive employee rostered', LEAVE_CAP: 'More leave approved than the cap allows'};
  let typeF = S.confType || '';
  const draw = () => {
    const list = all.filter(x => !typeF || x.Type === typeF).sort((a, b) => (a.Severity === 'high' ? 0 : 1) - (b.Severity === 'high' ? 0 : 1) || a.Date.localeCompare(b.Date));
    $('#clist').innerHTML = list.length ? `<div class="tbl-wrap"><table class="t"><thead><tr><th>Date</th><th>Employee</th><th>Type</th><th>Severity</th><th>Details</th><th></th></tr></thead><tbody>
      ${list.map(x => `<tr class="click" data-d="${x.Date}" data-e="${esc(x.EmpID)}"><td class="nowrap">${fmtD(x.Date)}</td><td>${esc(x.Name)} <span class="muted small">${esc(x.EmpID)}</span></td>
        <td class="nowrap">${esc(x.Type.replace('_', ' '))}</td><td><span class="chip sev-${x.Severity}">${x.Severity}</span></td><td>${esc(x.Message)}</td><td><span class="btn sm">Fix ›</span></td></tr>`).join('')}
      </tbody></table></div>` : '<div class="empty">No conflicts in this period 🎉</div>';
    $$('#clist tr.click').forEach(tr => tr.onclick = () => gotoCell(tr.dataset.e, tr.dataset.d));
  };
  const gaps = [];
  U.dates(start, end).forEach(d => ['A', 'B'].forEach(s => { const x = st[d][s]; if (x.sched < x.req) gaps.push(`<tr><td>${fmtD(d)}</td><td>${esc(sd[s].name)}</td><td class="num">${fmtN(x.sched)}</td><td class="num">${x.req}</td><td class="num cov-bad">−${fmtN(x.req - x.sched)}</td></tr>`); }));
  V.innerHTML = `<div class="card"><div class="toolbar">${rangeNav()}</div>
    <div class="row" style="margin-bottom:12px"><button class="btn sm ${!typeF ? 'primary' : ''}" data-ct="">All (${all.length})</button>
      ${Object.keys(types).map(k => `<button class="btn sm ${typeF === k ? 'primary' : ''}" data-ct="${k}" title="${esc(DESC[k] || '')}">${k.replace('_', ' ')} (${types[k]})</button>`).join('')}</div>
    <div id="clist"></div></div>
    <div class="card"><div class="card-h"><h2>Understaffed vs demand</h2></div>
      ${gaps.length ? `<div class="tbl-wrap"><table class="t"><thead><tr><th>Date</th><th>Shift</th><th>Scheduled</th><th>Required</th><th>Gap</th></tr></thead><tbody>${gaps.join('')}</tbody></table></div>` : '<div class="empty">Every shift meets required headcount.</div>'}</div>`;
  bindRangeNav(V);
  $$('[data-ct]', V).forEach(b => b.onclick = () => { S.confType = typeF = b.dataset.ct; viewConflicts(V); });
  draw();
}

async function decideSwap(id, approve, force){
  const r = await write('decideSwap', {swapId: id, approve, force});
  if (!r.ok && r.needsForce) {
    modal('Swap creates conflicts', `<div class="issues">${r.conflicts.map(x => `<div class="issue"><span class="chip sev-${x.Severity}">${x.Severity}</span>${esc(x.Name)}: ${esc(x.Message)}</div>`).join('')}</div>`,
      [{label:'Cancel'}, {label:'Approve anyway', cls:'warn', onClick: () => decideSwap(id, true, true)}]);
    return;
  }
  if (!r.ok) return toast(r.error, true);
  toast(approve ? 'Swap approved and applied to roster' : 'Swap rejected'); load();
}

        <label class="f full">Note<input type="text" id="avn" maxlength="150"></label></div>
      <button class="btn" id="avgo" style="margin-top:10px">Add</button>
      <div class="small muted" style="margin-top:8px">The schedule builder keeps you off these days, and supervisors see a conflict if you are already rostered.</div>
      ${myAvail.length ? `<div class="tbl-wrap" style="margin-top:12px"><table class="t"><tbody>${myAvail.map(a => `<tr><td class="nowrap">${fmtD(a.Date)}</td><td>${esc(a.Type)}</td><td class="small">${esc(a.Note)}</td><td><button class="btn sm" data-ra="${a.ID}">Remove</button></td></tr>`).join('')}</tbody></table></div>` : ''}
    </div>
  </div>`;
  leaveForm(false, $('#lfHost'));
  $$('[data-cl]', V).forEach(b => b.onclick = async () => {
    if (!confirm('Cancel this leave? If it was approved, your slot goes to the next person in the queue.')) return;
    const r = await write('cancelLeave', {leaveId: b.dataset.cl}); if (!r.ok) return toast(r.error, true); toast('Leave cancelled'); load(); });
  $$('[data-rs]', V).forEach(b => b.onclick = async () => { const r = await write('respondSwap', {swapId: b.dataset.rs, accept: b.dataset.a === '1'}); if (!r.ok) return toast(r.error, true); toast(b.dataset.a === '1' ? 'Accepted — waiting for supervisor' : 'Declined'); load(); });
  $$('[data-cs]', V).forEach(b => b.onclick = async () => { const r = await write('cancelSwap', {swapId: b.dataset.cs}); if (!r.ok) return toast(r.error, true); toast('Swap withdrawn'); load(); });
  $$('[data-ra]', V).forEach(b => b.onclick = async () => { const r = await write('removeAvailability', {id: b.dataset.ra}); if (!r.ok) return toast(r.error, true); load(); });
  $('#avgo').onclick = async () => { const r = await write('addAvailability', {from: $('#avf').value, to: $('#avt').value, type: $('#avy').value, note: $('#avn').value}); if (!r.ok) return toast(r.error, true); toast('Saved'); load(); };
  const db = localDb(), c = cfg();
  const fillSwap = () => {
    const d = $('#swd').value; if (!d) return;
    const mine = RosterCore.currentShift(db, c, S.me, d);
    const opts = S.d.employees.filter(e => e.EmpID !== me && String(e.Status || 'Active') === 'Active').map(e => ({e, s: RosterCore.currentShift(db, c, e, d)})).filter(x => x.s !== mine);
    $('#swe').innerHTML = opts.length ? opts.map(x => `<option value="${esc(x.e.EmpID)}">${esc(x.e.Name)} — ${x.s}</option>`).join('') : '<option value="">No one on a different shift</option>';
    $('#swinfo').innerHTML = `You are on <span class="chip c-${mine}">${mine}</span> that day${d > S.d.range[1] ? ' (from your planned pattern)' : ''}.`;
  };
  $('#swd').onchange = fillSwap; fillSwap();
  $('#swgo').onclick = async () => { if (!$('#swe').value) return toast('Pick a colleague', true);
    const r = await write('requestSwap', {date: $('#swd').value, toEmp: $('#swe').value, reason: $('#swr').value}); if (!r.ok) return toast(r.error, true); toast('Swap request sent'); load(); };
}

function leaveForm(onBehalf, host){
  const c = cfg(), t = today(), cats = String(c.LEAVE_CATEGORIES).split(',').map(s => s.trim()).filter(Boolean);
  const html = `<div class="form">
      ${onBehalf ? `<label class="f full">Employee<select id="lvE">${S.d.employees.filter(e => String(e.Status || 'Active') === 'Active').map(e => `<option value="${esc(e.EmpID)}">${esc(e.Name)} (${esc(e.EmpID)})</option>`).join('')}</select></label>` : ''}
      <label class="f">Type<select id="lvC">${cats.map(x => `<option>${esc(x)}</option>`).join('')}</select></label>
      <label class="f">Duration<select id="lvD"><option>Full Day</option><option>First Half</option><option>Second Half</option></select></label>
      <label class="f">From<input type="date" id="lvF" value="${U.addDays(t, Math.max(1, +c.MIN_NOTICE_DAYS || 0))}" ${onBehalf ? '' : `min="${t}"`}></label>
      <label class="f">To<input type="date" id="lvT" value="${U.addDays(t, Math.max(1, +c.MIN_NOTICE_DAYS || 0))}"></label>
      <label class="f full">Reason<input type="text" id="lvR" maxlength="300" placeholder="Optional"></label>
    </div>
    <div id="lvP" style="margin-top:12px"></div>
    ${onBehalf ? '' : '<button class="btn primary" id="lvGo" style="margin-top:12px">Submit request</button>'}`;
  let root;
  if (onBehalf) root = modal('Enter leave for an employee', html, [{label:'Cancel'}, {label:'Submit', cls:'primary', onClick: () => submit(true)}]);
  else { host.innerHTML = html; root = host; }
  const who = () => onBehalf ? empById($('#lvE', root).value) : S.me;
  const preview = () => {
    const f = $('#lvF', root).value, d = $('#lvD', root).value, toEl = $('#lvT', root);
    toEl.disabled = d !== 'Full Day'; if (d !== 'Full Day' || toEl.value < f) toEl.value = f;
    if (!f) return;
    const to = toEl.value || f;
    if (U.diffDays(f, to) > 31) { $('#lvP', root).innerHTML = '<div class="note warn small">Range too long</div>'; return; }
    const rows = RosterCore.leavePreview(localDb(), who(), f, to, d);
    const beyond = to > S.d.range[1];
    $('#lvP', root).innerHTML = `<div class="tbl-wrap"><table class="t"><thead><tr><th>Date</th><th>Shift</th><th>Slots used</th><th>Queue</th><th>Expected</th></tr></thead><tbody>
      ${rows.map(r => `<tr><td class="nowrap">${fmtD(r.Date)}</td><td>${U.isWork(r.Shift) ? `<span class="chip c-${r.Shift}">${r.Shift}</span>` : `<span class="chip c-${r.Shift}">${r.Shift}</span>`}</td>
        <td class="num">${r.Cap != null ? fmtN(r.Used) + ' / ' + r.Cap : ''}${r.Holders && r.Holders.length ? `<div class="small muted">${r.Holders.map(esc).join(', ')}</div>` : ''}</td><td class="num">${r.Queue != null ? r.Queue : ''}</td>
        <td><span class="chip ${/approved/.test(r.Outcome) && !/Already/.test(r.Outcome) ? 'st-Approved' : /Waitlist/.test(r.Outcome) ? 'st-Waitlisted' : 'st-Cancelled'}">${esc(r.Outcome)}</span></td></tr>`).join('')}
      </tbody></table></div><div class="small muted" style="margin-top:6px">Live preview${beyond ? ' (dates beyond the loaded range use your planned pattern)' : ''}. The server decides by exact request time — if someone submits a moment before you, you join the queue.</div>`;
  };
  async function submit(keepOpenOnErr){
    const r = await write('requestLeave', {empId: onBehalf ? $('#lvE', root).value : undefined, category: $('#lvC', root).value, duration: $('#lvD', root).value,
      from: $('#lvF', root).value, to: $('#lvT', root).value, reason: $('#lvR', root).value});
    if (!r.ok) { toast(r.error, true); return keepOpenOnErr ? true : undefined; }
    const res = r.data.results, ap = res.filter(x => x.Status === 'Approved').length, wl = res.filter(x => x.Status === 'Waitlisted');
    modal('Leave request received', `<div class="small muted" style="margin-bottom:8px">Server time ${fmtTs(r.data.requestedAt)}</div><div class="issues">${res.map(x => `<div class="issue"><span class="chip ${x.Status === 'Approved' ? 'st-Approved' : x.Status === 'Waitlisted' ? 'st-Waitlisted' : 'st-Cancelled'}">${x.Status}${x.QueueNo ? ' #' + x.QueueNo : ''}</span>${fmtD(x.Date)} — ${esc(x.Note)}</div>`).join('')}</div>
      ${wl.length ? '<div class="note small" style="margin-top:10px">Waitlisted days are approved automatically, in queue order, if a slot frees up.</div>' : ''}`, [{label:'OK', cls:'primary'}]);
    toast(`${ap} day(s) approved` + (wl.length ? `, ${wl.length} waitlisted` : ''));
    load(true);
  }
  ['#lvF', '#lvT', '#lvD', '#lvE'].forEach(s => { const el = $(s, root); if (el) el.onchange = preview; });
  const go = $('#lvGo', root); if (go) go.onclick = async () => { go.disabled = true; go.textContent = 'Getting your place in the queue…'; await submit(); go.disabled = false; go.textContent = 'Submit request'; };
  preview();
}

/* ---------------- VIEW: employees (admin) ---------------- */
function viewPeople(V){
  const list = S.d.employees.slice().sort((a, b) => a.EmpID.localeCompare(b.EmpID));
  V.innerHTML = `<div class="card"><div class="card-h"><h2>Employees (${list.length})</h2><span class="spacer"></span><button class="btn primary" id="addEmp">+ Add employee</button></div>
    <div class="tbl-wrap"><table class="t"><thead><tr><th>ID</th><th>Name</th><th>Role</th><th>Department</th><th>Location</th><th>Shift</th><th>Pattern</th><th>Weekly off</th><th>Access</th><th>Status</th><th></th></tr></thead><tbody>
    ${list.map(e => `<tr><td>${esc(e.EmpID)}</td><td>${esc(e.Name)}</td><td>${esc(e.Role)}</td><td>${esc(e.Department)}</td><td>${esc(e.Location)}</td><td><span class="chip c-${e.DefaultShift === 'B' ? 'B' : 'A'}">${esc(e.DefaultShift)}</span></td>
      <td>${esc(e.Pattern)}</td><td>${esc(e.WeeklyOff)}</td><td>${esc(e.Access)}</td><td>${esc(e.Status)}</td>
      <td class="nowrap"><button class="btn sm" data-ed="${esc(e.EmpID)}">Edit</button> <button class="btn sm" data-rp="${esc(e.EmpID)}">Reset PIN</button></td></tr>`).join('')}
    </tbody></table></div></div>`;
  $('#addEmp').onclick = () => empForm(null);
  $$('[data-ed]', V).forEach(b => b.onclick = () => empForm(empById(b.dataset.ed)));
  $$('[data-rp]', V).forEach(b => b.onclick = async () => {
    if (!confirm('Reset PIN for ' + b.dataset.rp + ' to the default PIN?')) return;
    const r = await write('resetPin', {empId: b.dataset.rp}); if (!r.ok) return toast(r.error, true); toast('PIN reset to default (' + r.data.defaultPin + ')'); });
}
function empForm(e){
  const isNew = !e; e = e || {Status: 'Active', Access: 'Employee', Pattern: 'Fixed', DefaultShift: 'A', WeeklyOff: 'Sun'};
  const txt = (k, l, ph) => `<label class="f">${l}<input type="text" data-ef="${k}" value="${esc(e[k] || '')}" placeholder="${ph || ''}" ${k === 'EmpID' && !isNew ? 'disabled' : ''}></label>`;
  const sel = (k, l, vals) => `<label class="f">${l}<select data-ef="${k}">${vals.map(v => `<option ${e[k] === v ? 'selected' : ''}>${v}</option>`).join('')}</select></label>`;
  const days = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'], off = String(e.WeeklyOff || '').split(/[,;\s]+/);
  modal(isNew ? 'Add employee' : 'Edit ' + e.Name, `<div class="form">${txt('EmpID', 'Employee ID', 'E019')}${txt('Name', 'Full name')}${txt('Role', 'Role', 'Agent')}${txt('Department', 'Department')}${txt('Location', 'Location')}
    ${sel('DefaultShift', 'Default shift', ['A', 'B'])}${sel('Pattern', 'Shift pattern', ['Fixed', 'Rotational', 'Flexible'])}${sel('Access', 'Access', ['Employee', 'Supervisor', 'Admin'])}${sel('Status', 'Status', ['Active', 'Inactive', 'On Notice'])}
    ${txt('Email', 'Email (optional)')}
    <div class="full"><div class="small muted" style="font-weight:550;margin-bottom:4px">Weekly off</div><div class="row">${days.map(d => `<label class="chk"><input type="checkbox" data-wo="${d}" ${off.includes(d) ? 'checked' : ''}>${d}</label>`).join('')}</div></div></div>
    ${isNew ? `<div class="small muted" style="margin-top:10px">New employees sign in with the default PIN (${esc(cfg().DEFAULT_PIN)}) and must change it.</div>` : ''}`,
  [{label:'Cancel'}, {label:'Save', cls:'primary', onClick: async () => {
    const o = {}; $$('[data-ef]').forEach(i => o[i.dataset.ef] = i.value);
    o.WeeklyOff = $$('[data-wo]').filter(c => c.checked).map(c => c.dataset.wo).join(',');
    if (!isNew) o.EmpID = e.EmpID;
    const r = await write('upsertEmployee', {emp: o, isNew}); if (!r.ok) { toast(r.error, true); return true; } toast('Saved'); load();
  }}]);
}

/* ---------------- VIEW: settings (admin) ---------------- */
function viewSettings(V){
  const rows = S.d.configRows || [];
  V.innerHTML = `<div class="card"><div class="card-h"><h2>Settings</h2><span class="spacer"></span><button class="btn primary" id="saveCfg">Save settings</button></div>
    <div class="note small" style="margin-bottom:12px">These live in the <b>Config</b> tab of the Google Sheet; edit them here or there.</div>
    <div class="tbl-wrap"><table class="t"><thead><tr><th>Setting</th><th>Value</th><th>What it does</th></tr></thead><tbody>
    ${rows.map(r => `<tr><td class="nowrap small"><code>${esc(r.Key)}</code></td><td><input type="text" data-ck="${esc(r.Key)}" value="${esc(r.Value)}" style="width:100%;min-width:140px"></td><td class="small muted">${esc(r.Description)}</td></tr>`).join('')}
    </tbody></table></div>
    ${!API_URL ? '<div style="margin-top:12px"><button class="btn danger" id="resetDemo2">Reset demo data</button></div>' : ''}</div>`;
  $('#saveCfg').onclick = async () => {
    const r = await write('saveConfig', {rows: $$('[data-ck]').map(i => ({Key: i.dataset.ck, Value: i.value.trim()}))});
    if (!r.ok) return toast(r.error, true); toast('Settings saved'); load();
  };
  const rd = $('#resetDemo2'); if (rd) rd.onclick = () => { if (confirm('Reset all demo data?')) { Demo.reset(); logout(true); } };
}

/* ---------------- start ---------------- */
(async function init(){
  try { const th = localStorage.getItem('roster-theme'); if (th) document.documentElement.dataset.theme = th; } catch(e){}
  S.token = store('roster-token');
  if (!S.token) return renderLogin();
  let snap = null; try { snap = JSON.parse(store('roster-snap') || 'null'); } catch (e) {}
  if (snap) { setData(snap, false); S.snapStr = store('roster-snap'); initState(); render(); startTimer(); refresh(); ensure(); return; }
  const ok = await boot(); if (!ok && !S.d) renderLogin();
})();
</script>
